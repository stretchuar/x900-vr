<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X900 Wireframe Plant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Single deliberate look: a dark holographic instrument overlay on the 3D scene.
   Layout: full-viewport canvas; top bar (title + modes); left style drawer; right data card
   (bottom sheet on phones); joystick bottom-left in walk mode; position readout bottom-right. */
:root{
  color-scheme: dark;
  --ink:#dff7ff; --dim:#86bcd2; --panel:rgba(3,14,26,.78); --solid:#03101d; --edge:rgba(127,220,255,.38);
  --accent:#ffb43a; --ok:#49d28a; --mid:#ffb347; --low:#ff6b6b;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#020a14;color:var(--ink);font:13px/1.45 var(--mono);overflow:hidden;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 14px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(2,10,20,.9),rgba(2,10,20,0));pointer-events:none}
.bar>*{pointer-events:auto}
h1{font:500 20px/1 var(--head);letter-spacing:.22em;text-transform:uppercase;margin:0 6px 0 0;text-wrap:balance}
h1 small{display:block;font:400 10px/1.3 var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:none;margin-top:3px}
.grp{display:flex;gap:4px;flex-wrap:wrap}
button,select,input[type=color]{font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:0;min-height:34px;padding:0 11px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
select{clip-path:none;max-width:46vw;background:var(--solid)}
button[aria-pressed=true]{background:var(--ink);color:#03101d;border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{padding:2px;width:44px;clip-path:none}
.glass{background:var(--panel);border:1px solid var(--edge);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.drawer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(96px + env(safe-area-inset-top,0px));width:min(290px,calc(100vw - 24px));max-height:calc(100dvh - 190px);overflow:auto;padding:10px 12px}
.drawer h2,.box h2{font:500 13px/1 var(--head);letter-spacing:.24em;text-transform:uppercase;margin:2px 0 8px;color:var(--dim)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.row label{flex:1;min-width:0}
.row input[type=range]{width:120px;accent-color:var(--accent)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.box{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(96px + env(safe-area-inset-top,0px));width:min(330px,calc(100vw - 24px));max-height:calc(100dvh - 140px);overflow:auto;
  padding:12px 14px;border-left:2px solid var(--accent);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.box h3{font:500 22px/1.1 var(--head);letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;text-wrap:balance}
.box dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 8px}
.box dt{color:var(--dim)} .box dd{margin:0;min-width:0;overflow-wrap:anywhere}
.box table{border-collapse:collapse;width:100%;font-size:12px}
.box th,.box td{text-align:left;padding:3px 6px 3px 0;border-top:1px solid var(--edge);vertical-align:top}
.box th{color:var(--dim);font-weight:400}
.tw{overflow-x:auto}
.chip{display:inline-block;padding:1px 7px;border:1px solid currentColor;font-size:11px}
.high{color:var(--ok)} .medium{color:var(--mid)} .low{color:var(--low)}
.x{float:right;min-height:28px;padding:0 9px;margin-right:10px}
.hint{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 24px);padding:6px 10px;color:var(--dim);font-size:11px;text-align:center;pointer-events:none}
.pos{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:11px;text-align:right;pointer-events:none;letter-spacing:.06em}
#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(54px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--edge);background:rgba(3,14,26,.45);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--ink);opacity:.8}
#err{position:fixed;inset:auto 12px 60px 12px;background:#5a0f14;border:1px solid var(--low);padding:10px}
@media (max-width:700px){
  h1{font-size:17px}
  .box{top:auto;right:8px;left:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;max-height:40dvh}
  .drawer{top:calc(132px + env(safe-area-inset-top,0px));max-height:calc(100dvh - 240px)}
  .pos{display:none}
}
</style>

<body>
<canvas id="cv" tabindex="0" aria-label="3D x-ray wireframe of the X900 production and DP assembly areas"></canvas>

<div class="bar">
  <h1>X900 Wireframe Plant<small>Fradley · dimension set 17 Nov 2026 · metres</small></h1>

  <div class="row"><label for="sLab">Status boards</label><input type="checkbox" id="sLab" checked></div>
  <div class="row"><label for="sDet">Drawing detail</label><input type="checkbox" id="sDet" checked></div>
  <div class="row"><label for="sPan">Panel lines</label><input type="checkbox" id="sPan"></div>

  <div class="row"><label for="sSolid">Solid machines (walk / VR)</label><input type="checkbox" id="sSolid" checked></div>
</div>

    b.onclick=function(){

/* ---------- collision: floor-level parts block walking (overhangs above 1.6 m don't) ---------- */
var SOLID=true, BODY=.3, colBoxes=[];
(function(){var skip={lines:1,swing:1,frame:1,rail:1,cage:1};
  DIM.machines.forEach(function(m){(m.parts||[]).forEach(function(p){var b=p.box;if(skip[p.kind]||!b||b[2]<=0||b[3]<=0)return;if(p.z0>1.6||p.z1<.15)return;
    colBoxes.push([b[0]-OX,b[0]+b[2]-OX,-(b[1]+b[3]-OY),-(b[1]-OY)])})});})();
function collide(pos){ // pos: {x,z}; returns correction [dx,dz]
  if(!SOLID)return [0,0];var cx=0,cz=0;
  for(var it=0;it<3;it++){var moved=false;
    for(var i=0;i<colBoxes.length;i++){var b=colBoxes[i],x=pos.x+cx,z=pos.z+cz;
      if(x<b[0]-BODY||x>b[1]+BODY||z<b[2]-BODY||z>b[3]+BODY)continue;
      var nx=Math.max(b[0],Math.min(x,b[1])),nz=Math.max(b[2],Math.min(z,b[3])),dx=x-nx,dz=z-nz,d=Math.hypot(dx,dz);
      if(d>=BODY)continue;
      if(d>1e-6){cx+=dx/d*(BODY-d);cz+=dz/d*(BODY-d)}
      else{var l=x-b[0],r=b[1]-x,t=z-b[2],bt=b[3]-z,mn=Math.min(l,r,t,bt);
        if(mn===l)cx-=l+BODY;else if(mn===r)cx+=r+BODY;else if(mn===t)cz-=t+BODY;else cz+=bt+BODY}
      moved=true}
    if(!moved)break}
  return [cx,cz];
}
/* ---------- hand tracking (Quest): left pinch-and-hold walks where the left hand points; right pinch selects ---------- */
var JN=['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip'];
var handDots=null,pinch={left:false,right:false},HQ=new T.Quaternion(),HV=new T.Vector3();
function handsMove(dt,frame){
  var s=renderer.xr.getSession(),ref=renderer.xr.getReferenceSpace();if(!s||!frame||!ref||!frame.getJointPose)return;
  if(!handDots){var g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(new Float32Array(150),3));g.setAttribute('color',new T.Float32BufferAttribute(new Float32Array(150),3));
    handDots=new T.Points(g,new T.PointsMaterial({size:.011,vertexColors:true,transparent:true,opacity:.95,depthTest:false}));handDots.frustumCulled=false;handDots.renderOrder=10;rig.add(handDots)}
  var pos=handDots.geometry.attributes.position,col=handDots.geometry.attributes.color,n=0,any=false,acc=new T.Color(S.acc),wht=new T.Color(S.line);
  for(var i=0;i<s.inputSources.length;i++){var src=s.inputSources[i],h=src.hand;if(!h)continue;any=true;
    var hand=src.handedness,jp={};
    for(var j=0;j<JN.length;j++){var sp=h.get?h.get(JN[j]):h[j];if(!sp)continue;var p=frame.getJointPose(sp,ref);if(!p)continue;jp[JN[j]]=p.transform.position;
      if(n<50){pos.setXYZ(n,p.transform.position.x,p.transform.position.y,p.transform.position.z);var c=pinch[hand]?acc:wht;col.setXYZ(n,c.r,c.g,c.b);n++}}
    var a=jp['thumb-tip'],b=jp['index-finger-tip'];
    if(a&&b){var d=Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);pinch[hand]=pinch[hand]?d<.04:d<.022}else pinch[hand]=false;
    if(hand==='left'&&pinch.left){var rp=frame.getPose(src.targetRaySpace,ref);if(rp){var o=rp.transform.orientation;HQ.set(o.x,o.y,o.z,o.w);
      HV.set(0,0,-1).applyQuaternion(HQ).applyQuaternion(rig.quaternion);HV.y=0;if(HV.lengthSq()>1e-4){HV.normalize();rig.position.addScaledVector(HV,1.6*dt)}}}
  }
  for(;n<50;n++)pos.setXYZ(n,0,-99,0);pos.needsUpdate=true;col.needsUpdate=true;handDots.visible=any;
  if(any&&SOLID){var hp=new T.Vector3();renderer.xr.getCamera(camera).getWorldPosition(hp);var c2=collide({x:hp.x,z:hp.z});rig.position.x+=c2[0];rig.position.z+=c2[1]}
}
var snapReady=true;
function vrMove(dt){
  var s=renderer.xr.getSession();if(!s)return;var xc=renderer.xr.getCamera(camera),f=new T.Vector3();xc.getWorldDirection(f);f.y=0;f.normalize();var r=new T.Vector3(-f.z,0,f.x);
  for(var i=0;i<s.inputSources.length;i++){var src=s.inputSources[i],gp=src.gamepad;if(!gp||gp.axes.length<4)continue;var ax=gp.axes[2],ay=gp.axes[3];
    if(src.handedness==='left'){if(Math.abs(ax)>.15)rig.position.addScaledVector(r,ax*2.5*dt);if(Math.abs(ay)>.15)rig.position.addScaledVector(f,-ay*2.5*dt)}
    else{if(Math.abs(ax)>.7&&snapReady){rig.rotateY(-Math.sign(ax)*Math.PI/6);snapReady=false}if(Math.abs(ax)<.3)snapReady=true}}
  if(SOLID){var hp=new T.Vector3();xc.getWorldPosition(hp);

    var c=collide({x:hp.x,z:hp.z});rig.position.x+=c[0];rig.position.z+=c[1]}
  if(false&&selected&&hud){var a=machines[selected].center,b=new T.Vector3();hud.getWorldPosition(b);var p=hudTrace.geometry.attributes.position;p.setXYZ(0,a.x,machines[selected].m.h,a.z);p.setXYZ(1,b.x,b.y,b.z);p.needsUpdate=true;hudTrace.visible=true}else hudTrace.visible=false;
}

/* ---------- UI wiring ---------- */
(function(){
  var g=$('goto'),o=function(v,t){var e=document.createElement('option');e.value=v;e.textContent=t;g.appendChild(e)};
  o('','Go to…');o('@P','Area: production');o('@L','Area: DP assembly');o('@A','Whole site');

  $('mOrbit').onclick=function(){setMode('orbit')};$('mWalk').onclick=function(){setMode('walk')};
  $('mTop').onclick=function(){if(mode!=='orbit')setMode('orbit');orb.pol=.05;orb.az=0};

function resize(){var w=window.innerWidth,h=window.innerHeight;if(renderer.xr.isPresenting)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();mats.forEach(function(m){m.resolution.set(w,h)})}
window.addEventListener('resize',resize);
var last=performance.now(), cp=new T.Vector3(), tick=0;
renderer.setAnimationLoop(function(now,frame){
  var dt=Math.min(.1,(now-last)/1000);last=now;tick++;
  if(renderer.xr.isPresenting){vrMove(dt);handsMove(dt,frame)}else if(handDots)handDots.visible=false;
  else{
    if(fly){var k=Math.min(1,(now-fly.t0)/650),e=k*k*(3-2*k);orb.t.lerpVectors(fly.a,fly.b,e);orb.d=fly.d0+(fly.d1-fly.d0)*e;if(k>=1)fly=null}
    if(mode==='walk'){var sp=(keys.shift?7:3)*dt,fx=-Math.sin(walk.yaw),fz=-Math.cos(walk.yaw),mf=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,ms=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
      camera.position.x+=(fx*mf-fz*ms)*sp;camera.position.z+=(fz*mf+fx*ms)*sp;camera.position.y=1.7;var cc=collide(camera.position);camera.position.x+=cc[0];camera.position.z+=cc[1]}

    B.mesh.material.opacity=selected===id?1:Math.min(1,Math.max(.35,(90-d)/40));
